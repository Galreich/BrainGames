<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Rocket body -->
  <ellipse cx="100" cy="95" rx="28" ry="55" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <!-- Rocket nose -->
  <path d="M72 60 Q100 5 128 60" fill="#ff4757"/>
  <!-- Window -->
  <circle cx="100" cy="80" r="14" fill="#70a1ff" stroke="#ddd" stroke-width="2"/>
  <circle cx="100" cy="80" r="9" fill="#1e90ff"/>
  <ellipse cx="96" cy="76" rx="3" ry="4" fill="rgba(255,255,255,0.5)"/>
  <!-- Fins -->
  <path d="M72 120 L52 150 L72 140 Z" fill="#ff4757"/>
  <path d="M128 120 L148 150 L128 140 Z" fill="#ff4757"/>
  <!-- Flame -->
  <ellipse cx="100" cy="155" rx="16" ry="22" fill="#ffa502" opacity="0.9"/>
  <ellipse cx="100" cy="155" rx="10" ry="16" fill="#ff6348"/>
  <ellipse cx="100" cy="155" rx="5" ry="10" fill="#fffa65"/>
  <!-- Stars -->
  <text x="30" y="40" font-size="20" opacity="0.8">✦</text>
  <text x="155" y="55" font-size="16" opacity="0.6">✦</text>
  <text x="25" y="140" font-size="14" opacity="0.5">✦</text>
  <text x="165" y="120" font-size="18" opacity="0.7">✦</text>
  <!-- Math symbols floating -->
  <text x="20" y="85" font-size="22" fill="#fff" opacity="0.7" font-weight="bold">+</text>
  <text x="160" y="90" font-size="22" fill="#fff" opacity="0.7" font-weight="bold">×</text>
  <text x="35" y="170" font-size="20" fill="#fff" opacity="0.6" font-weight="bold">=</text>
  <text x="150" y="170" font-size="20" fill="#fff" opacity="0.6" font-weight="bold">÷</text>
</svg>
