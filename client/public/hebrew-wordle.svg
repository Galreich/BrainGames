<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Wordle grid -->
  <g transform="translate(35, 40)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="32" height="32" rx="4" fill="#0984e3"/>
    <rect x="36" y="0" width="32" height="32" rx="4" fill="#74b9ff"/>
    <rect x="72" y="0" width="32" height="32" rx="4" fill="#a4c8e8"/>
    <rect x="108" y="0" width="32" height="32" rx="4" fill="#0984e3"/>
    <!-- Row 2 -->
    <rect x="0" y="36" width="32" height="32" rx="4" fill="#a4c8e8"/>
    <rect x="36" y="36" width="32" height="32" rx="4" fill="#0984e3"/>
    <rect x="72" y="36" width="32" height="32" rx="4" fill="#74b9ff"/>
    <rect x="108" y="36" width="32" height="32" rx="4" fill="#a4c8e8"/>
    <!-- Row 3 - empty -->
    <rect x="0" y="72" width="32" height="32" rx="4" fill="none" stroke="#74b9ff" stroke-width="2"/>
    <rect x="36" y="72" width="32" height="32" rx="4" fill="none" stroke="#74b9ff" stroke-width="2"/>
    <rect x="72" y="72" width="32" height="32" rx="4" fill="none" stroke="#74b9ff" stroke-width="2"/>
    <rect x="108" y="72" width="32" height="32" rx="4" fill="none" stroke="#74b9ff" stroke-width="2"/>
    <!-- Hebrew letters row 1 -->
    <text x="16" y="23" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">א</text>
    <text x="52" y="23" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">ב</text>
    <text x="88" y="23" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">ג</text>
    <text x="124" y="23" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">ד</text>
    <!-- Hebrew letters row 2 -->
    <text x="16" y="59" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">ד</text>
    <text x="52" y="59" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">א</text>
    <text x="88" y="59" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">ב</text>
    <text x="124" y="59" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">ג</text>
  </g>
  <!-- Floating letter circles -->
  <circle cx="25" cy="30" r="18" fill="#0984e3" opacity="0.8"/>
  <text x="25" y="36" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">א</text>
  <circle cx="175" cy="25" r="16" fill="#74b9ff" opacity="0.7"/>
  <text x="175" y="31" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">ד</text>
  <!-- Magnifying glass -->
  <circle cx="150" cy="155" r="22" fill="none" stroke="#74b9ff" stroke-width="4" opacity="0.7"/>
  <line x1="166" y1="171" x2="180" y2="185" stroke="#74b9ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- Light bulb -->
  <g transform="translate(25, 145)" opacity="0.7">
    <circle cx="15" cy="15" r="14" fill="#74b9ff"/>
    <rect x="10" y="28" width="10" height="6" rx="2" fill="#a4c8e8"/>
    <line x1="15" y1="0" x2="15" y2="-8" stroke="#74b9ff" stroke-width="2"/>
    <line x1="2" y1="8" x2="-4" y2="4" stroke="#74b9ff" stroke-width="2"/>
    <line x1="28" y1="8" x2="34" y2="4" stroke="#74b9ff" stroke-width="2"/>
  </g>
</svg>
